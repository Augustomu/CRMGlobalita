<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;min-width:0;height:100%;min-height:0;border-left:.5px solid var(--border);background:var(--surface);display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden;animation:om-abrir 180ms ease-out">
  <div style="display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:.5px solid var(--border)">
    <span style="font-size:11px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap">Repositorio</span>
    <span style="font-size:9px;color:var(--hint);white-space:nowrap;font-variant-numeric:tabular-nums">{{ n }}</span>
    <button type="button" onClick="{{ crear }}" title="Nuevo mensaje" style="margin-left:auto;width:26px;height:26px;flex-shrink:0;border-radius:8px;border:none;background:var(--accent);color:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background 150ms ease-out" style-hover="background:var(--accent-hover)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
    <button type="button" onClick="{{ cerrar }}" title="Cerrar" style="width:26px;height:26px;flex-shrink:0;border-radius:8px;border:.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background 150ms ease-out" style-hover="background:var(--bg);color:var(--text)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:12px;height:12px"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>

  <div style="display:flex;gap:4px;padding:6px 12px;border-bottom:.5px solid var(--border);align-items:center">
    <sc-for list="{{ filtros }}" as="f" hint-placeholder-count="2">
      <sc-if value="{{ f.on }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ f.elegir }}" style="padding:2px 10px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap;background:var(--accent);color:var(--surface);border:.5px solid var(--accent);cursor:pointer;font-family:inherit">{{ f.label }}</button>
      </sc-if>
      <sc-if value="{{ f.off }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ f.elegir }}" style="padding:2px 10px;border-radius:10px;font-size:10px;white-space:nowrap;background:transparent;color:var(--muted);border:.5px solid var(--border);cursor:pointer;font-family:inherit;transition:background 150ms ease-out" style-hover="background:var(--accent-light);color:var(--accent);border-color:var(--accent-br)">{{ f.label }}</button>
      </sc-if>
    </sc-for>
    <span style="margin-left:auto;font-size:9px;color:var(--hint);white-space:nowrap">los destacados van arriba</span>
  </div>

  <div style="min-height:0;overflow-y:auto;padding:8px 12px 20px;display:flex;flex-direction:column;gap:7px">
    <sc-for list="{{ items }}" as="m" hint-placeholder-count="4">
      <div draggable="true" onDragStart="{{ m.arrastrar }}" onDragOver="{{ m.sobre }}" onDrop="{{ m.soltar }}" onDragEnd="{{ m.fin }}" style="border:.5px solid {{ m.borde }};border-radius:12px;background:var(--surface);overflow:hidden;opacity:{{ m.opacidad }};transition:opacity 150ms ease-out">
        <div style="display:flex;align-items:center;gap:6px;padding:7px 8px 7px 10px">
          <span title="Arrastrá para reordenar" style="width:14px;flex-shrink:0;color:var(--hint);display:flex;align-items:center;justify-content:center;cursor:grab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:11px;height:11px"><path d="M9 6h.01M9 12h.01M9 18h.01M15 6h.01M15 12h.01M15 18h.01"></path></svg>
          </span>
          <button type="button" onClick="{{ m.abrir }}" style="flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:0;border:none;background:transparent;cursor:pointer;font-family:inherit;text-align:left">
            <span style="font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ m.nombre }}</span>
          </button>
          <div style="display:flex;gap:3px;flex-shrink:0">
            <sc-for list="{{ m.idiomas }}" as="i" hint-placeholder-count="3">
              <sc-if value="{{ i.tiene }}" hint-placeholder-val="{{ true }}">
                <span title="Cargado" style="font-size:9px;font-weight:600;padding:1px 5px;border-radius:8px;background:var(--accent-light);color:var(--accent);white-space:nowrap">{{ i.label }}</span>
              </sc-if>
              <sc-if value="{{ i.falta }}" hint-placeholder-val="{{ false }}">
                <span title="Sin cargar" style="font-size:9px;padding:1px 5px;border-radius:8px;background:transparent;color:var(--hint);border:.5px dashed var(--border);white-space:nowrap">{{ i.label }}</span>
              </sc-if>
            </sc-for>
          </div>
          <button type="button" onClick="{{ m.destacar }}" title="{{ m.tituloDestacar }}" style="width:24px;height:24px;flex-shrink:0;border-radius:8px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:{{ m.colorEstrella }};transition:background 150ms ease-out" style-hover="background:var(--accent-light)">
            <svg viewBox="0 0 24 24" fill="{{ m.rellenoEstrella }}" stroke="currentColor" stroke-width="1.6" style="width:13px;height:13px"><path d="M12 4l2.4 5 5.6.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.6-.8z"></path></svg>
          </button>
        </div>

        <sc-if value="{{ m.destacadoEn }}" hint-placeholder-val="{{ false }}">
          <div style="padding:0 10px 7px 32px;display:flex;align-items:center;gap:5px;flex-wrap:wrap">
            <span style="font-size:9px;color:var(--hint);white-space:nowrap">destacado en</span>
            <span style="font-size:9px;font-weight:600;padding:1px 6px;border-radius:8px;background:var(--accent-light);color:var(--accent);white-space:nowrap">{{ m.alcanceLabel }}</span>
            <button type="button" onClick="{{ m.quitarDestaque }}" title="Quitar de destacados" style="width:18px;height:18px;border-radius:50%;border:none;background:transparent;color:var(--hint);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background 150ms ease-out" style-hover="background:var(--error-light);color:var(--error)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:9px;height:9px"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </div>
        </sc-if>

        <sc-if value="{{ m.alcanceAbierto }}" hint-placeholder-val="{{ false }}">
          <div style="padding:8px 10px;border-top:.5px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:6px;animation:om-abrir 150ms ease-out">
            <span style="font-size:10px;font-weight:600;color:var(--text)">&iquest;Para qu&eacute; cuentas lo destaco?</span>
            <div style="display:flex;flex-direction:column;gap:4px">
              <sc-for list="{{ m.opciones }}" as="o" hint-placeholder-count="3">
                <button type="button" onClick="{{ o.elegir }}" style="display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:8px;border:.5px solid var(--border);background:var(--surface);cursor:pointer;font-family:inherit;text-align:left;transition:background 150ms ease-out" style-hover="background:var(--accent-light);border-color:var(--accent-br)">
                  <span style="font-size:11px;color:var(--text);white-space:nowrap">{{ o.label }}</span>
                  <span style="margin-left:auto;font-size:9px;color:var(--hint);white-space:nowrap">{{ o.detalle }}</span>
                </button>
              </sc-for>
            </div>
            <sc-if value="{{ m.eligiendoCuentas }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;gap:4px;flex-wrap:wrap;padding-top:4px;border-top:.5px solid var(--border);align-items:center">
                <sc-for list="{{ m.cuentas }}" as="a" hint-placeholder-count="6">
                  <sc-if value="{{ a.on }}" hint-placeholder-val="{{ false }}">
                    <button type="button" onClick="{{ a.alternar }}" style="padding:1px 8px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap;background:var(--accent);color:var(--surface);border:.5px solid var(--accent);cursor:pointer;font-family:inherit">{{ a.label }}</button>
                  </sc-if>
                  <sc-if value="{{ a.off }}" hint-placeholder-val="{{ true }}">
                    <button type="button" onClick="{{ a.alternar }}" style="padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap;background:var(--surface);color:var(--muted);border:.5px solid var(--border);cursor:pointer;font-family:inherit;transition:background 150ms ease-out" style-hover="background:var(--accent-light);color:var(--accent)">{{ a.label }}</button>
                  </sc-if>
                </sc-for>
                <button type="button" onClick="{{ m.confirmarCuentas }}" style="margin-left:auto;height:22px;padding:0 10px;border-radius:8px;border:none;background:var(--accent);color:var(--surface);font-size:10px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap">Destacar</button>
              </div>
            </sc-if>
          </div>
        </sc-if>

        <sc-if value="{{ m.abierta }}" hint-placeholder-val="{{ false }}">
          <div style="border-top:.5px solid var(--border);padding:8px 10px;display:flex;flex-direction:column;gap:6px;animation:om-abrir 150ms ease-out">
            <input type="text" value="{{ m.nombre }}" onChange="{{ m.renombrar }}" placeholder="Nombre del mensaje…" style="width:100%;box-sizing:border-box;height:26px;padding:0 8px;border:.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:11px;font-weight:500;font-family:inherit;outline:none;transition:border-color 150ms ease-out" style-focus="border-color:var(--accent)" />
            <div style="display:flex;align-items:center;gap:6px">
              <div style="display:flex;gap:0;border:.5px solid var(--border);border-radius:8px;overflow:hidden">
                <sc-for list="{{ m.tabs }}" as="t" hint-placeholder-count="3">
                  <sc-if value="{{ t.on }}" hint-placeholder-val="{{ true }}">
                    <button type="button" onClick="{{ t.elegir }}" style="height:24px;padding:0 10px;border:none;background:var(--accent);color:var(--surface);font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap">{{ t.label }}</button>
                  </sc-if>
                  <sc-if value="{{ t.off }}" hint-placeholder-val="{{ false }}">
                    <button type="button" onClick="{{ t.elegir }}" style="height:24px;padding:0 10px;border:none;background:var(--surface);color:var(--muted);font-size:10px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background 150ms ease-out" style-hover="background:var(--accent-light);color:var(--accent)">{{ t.label }}</button>
                  </sc-if>
                </sc-for>
              </div>
              <button type="button" onClick="{{ m.borrar }}" title="Eliminar mensaje" style="width:24px;height:24px;border-radius:8px;border:.5px solid var(--border);background:transparent;color:var(--hint);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background 150ms ease-out" style-hover="background:var(--error-light);border-color:var(--error);color:var(--error)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width:11px;height:11px"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"></path></svg>
              </button>
              <button type="button" onClick="{{ m.guardar }}" style="margin-left:auto;height:24px;padding:0 12px;border-radius:8px;border:none;background:var(--accent);color:var(--surface);font-size:10px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background 150ms ease-out" style-hover="background:var(--accent-hover)">Guardar</button>
            </div>
            <textarea value="{{ m.texto }}" onChange="{{ m.escribir }}" placeholder="Escribir el mensaje…" style="width:100%;box-sizing:border-box;min-height:132px;padding:9px 11px;border:.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:12px;line-height:1.6;font-family:inherit;resize:vertical;outline:none;transition:border-color 150ms ease-out" style-focus="border-color:var(--accent)"></textarea>
            <span style="font-size:9px;color:var(--hint);font-variant-numeric:tabular-nums">{{ m.chars }}</span>
          </div>
        </sc-if>
      </div>
    </sc-for>
    <sc-if value="{{ vacio }}" hint-placeholder-val="{{ false }}">
      <div style="padding:18px 8px;font-size:11px;color:var(--hint);text-align:center">{{ mensajeVacio }}</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:700},&quot;mensajes&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;},&quot;cuentaActual&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DL&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onCerrar&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onCambiar&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(lista:object[])=&gt;void&quot;}}">
class Component extends DCLogic {
  static IDIOMAS = [{ k: 'es', label: 'ES' }, { k: 'pt', label: 'PT' }, { k: 'en', label: 'EN' }];
  static CUENTAS = ['AL', 'DL', 'FR', 'ED', 'AU', 'AMU'];

  state = { lista: null, filtro: 'Todos', abierta: null, idioma: 'es', alcance: null, eligiendo: null, seleccion: [], arrastrando: null, sobre: null };

  get lista() { return this.state.lista || (this.props.mensajes || []).slice(); }
  mutar(nuevaLista, extra) {
    this.setState({ lista: nuevaLista, ...(extra || {}) });
    if (this.props.onCambiar) this.props.onCambiar(nuevaLista);
  }
  set(id, patch) { this.mutar(this.lista.map(m => m.id === id ? { ...m, ...patch } : m)); }

  reubicar(origen, destino) {
    if (!origen || origen === destino) return;
    const lista = this.lista.slice();
    const i = lista.findIndex(m => m.id === origen);
    const j = lista.findIndex(m => m.id === destino);
    if (i < 0 || j < 0) return;
    const [item] = lista.splice(i, 1);
    lista.splice(j, 0, item);
    this.mutar(lista, { arrastrando: null, sobre: null });
  }

  renderVals() {
    const cuenta = this.props.cuentaActual || 'DL';
    const orden = this.lista.slice();
    const destacados = orden.filter(m => m.destacado);
    const resto = orden.filter(m => !m.destacado);
    const visibles = (this.state.filtro === 'Favoritos' ? destacados : destacados.concat(resto));

    return {
      n: this.lista.length + ' mensajes · ' + destacados.length + ' destacados',
      filtros: ['Todos', 'Favoritos'].map(label => ({
        label, on: this.state.filtro === label, off: this.state.filtro !== label,
        elegir: () => this.setState({ filtro: label })
      })),
      crear: () => {
        const id = 'msg-' + Date.now();
        this.mutar([{ id, nombre: 'Mensaje nuevo', textos: { es: '', pt: '', en: '' }, destacado: null }].concat(this.lista), { abierta: id, idioma: 'es', filtro: 'Todos' });
      },
      vacio: visibles.length === 0,
      mensajeVacio: this.state.filtro === 'Favoritos' ? 'sin mensajes destacados' : 'sin mensajes cargados',
      items: visibles.map(m => {
        const abierta = this.state.abierta === m.id;
        const idioma = this.state.idioma;
        const textos = m.textos || {};
        const dest = m.destacado;
        return {
          nombre: m.nombre,
          renombrar: e => this.set(m.id, { nombre: e.target.value }),
          abierta,
          abrir: () => this.setState({ abierta: abierta ? null : m.id, idioma: 'es' }),
          arrastrar: () => this.setState({ arrastrando: m.id }),
          sobre: e => { e.preventDefault(); if (this.state.sobre !== m.id) this.setState({ sobre: m.id }); },
          soltar: e => { e.preventDefault(); this.reubicar(this.state.arrastrando, m.id); },
          fin: () => this.setState({ arrastrando: null, sobre: null }),
          opacidad: this.state.arrastrando === m.id ? '.45' : '1',
          borde: this.state.sobre === m.id && this.state.arrastrando !== m.id ? 'var(--accent)' : 'var(--border)',
          idiomas: Component.IDIOMAS.map(i => ({ label: i.label, tiene: !!textos[i.k], falta: !textos[i.k] })),
          tabs: Component.IDIOMAS.map(i => ({
            label: i.label, on: idioma === i.k, off: idioma !== i.k,
            elegir: () => this.setState({ idioma: i.k })
          })),
          texto: textos[idioma] || '',
          chars: (textos[idioma] || '').length + ' caracteres',
          escribir: e => this.set(m.id, { textos: { ...textos, [idioma]: e.target.value } }),
          guardar: () => this.setState({ abierta: null }),
          borrar: () => this.mutar(this.lista.filter(x => x.id !== m.id), { abierta: null }),

          colorEstrella: dest ? 'var(--accent)' : 'var(--hint)',
          rellenoEstrella: dest ? 'currentColor' : 'none',
          tituloDestacar: dest ? 'Destacado en ' + dest : 'Destacar este mensaje',
          destacadoEn: !!dest,
          alcanceLabel: dest || '',
          quitarDestaque: () => this.set(m.id, { destacado: null }),
          destacar: () => this.setState({ alcance: this.state.alcance === m.id ? null : m.id, eligiendo: null }),
          alcanceAbierto: this.state.alcance === m.id,
          opciones: [
            { label: 'Todas las cuentas', detalle: '6 cuentas', elegir: () => { this.set(m.id, { destacado: 'todas las cuentas' }); this.setState({ alcance: null }); } },
            { label: 'Solo esta cuenta', detalle: cuenta, elegir: () => { this.set(m.id, { destacado: cuenta }); this.setState({ alcance: null }); } },
            { label: 'Elegir cuentas', detalle: 'seleccionar', elegir: () => this.setState({ eligiendo: m.id, seleccion: [] }) }
          ],
          eligiendoCuentas: this.state.eligiendo === m.id,
          cuentas: Component.CUENTAS.map(label => ({
            label,
            on: this.state.seleccion.includes(label),
            off: !this.state.seleccion.includes(label),
            alternar: () => this.setState(s => ({
              seleccion: s.seleccion.includes(label) ? s.seleccion.filter(x => x !== label) : s.seleccion.concat([label])
            }))
          })),
          confirmarCuentas: () => {
            const sel = this.state.seleccion;
            if (!sel.length) return;
            this.set(m.id, { destacado: sel.join(', ') });
            this.setState({ alcance: null, eligiendo: null, seleccion: [] });
          }
        };
      }),
      cerrar: () => { if (this.props.onCerrar) this.props.onCerrar(); }
    };
  }
}
</script>
</body>
</html>
