<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#F2EEE6;--surface:#FAF7F1;--border:#D9D3C8;--text:#2D2D2A;--muted:#5E5A52;--hint:#8A8580;
      --accent:#0F6E56;--accent-br:#B8CEC5;--accent-light:#D9E9E3;--accent-hover:#0B5A47;
      --error:#B91C1C;--error-light:#FEE2E2;--warning:#9A6B0C;--warning-light:#FEF6E3;
      --success:#0F6B33;--success-light:#E8F5EB;--info-light:#F1F6F4;
    }
    @keyframes om-entrar{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
  </style>
</helmet>

<div style="height:100vh;min-height:520px;display:flex;align-items:center;justify-content:center;padding:28px;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,sans-serif;font-size:14px">
  <div style="width:100%;max-width:820px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;border:.5px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:0 10px 40px rgba(0,0,0,.08);animation:om-entrar 220ms ease-out">

    <form onSubmit="{{ enviar }}" style="padding:30px 30px 26px;display:flex;flex-direction:column;gap:16px;min-width:0">
      <div style="display:flex;flex-direction:column;gap:3px">
        <span style="font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)">CRM de prospecci&oacute;n</span>
        <span style="font-size:20px;font-weight:600;letter-spacing:-.01em">Iniciar sesi&oacute;n</span>
      </div>

      <label style="display:flex;flex-direction:column;gap:5px">
        <span style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--hint)">Usuario o email</span>
        <input type="text" value="{{ email }}" onChange="{{ setEmail }}" autoComplete="username" placeholder="nombre@empresa.com" style="height:38px;padding:0 11px;border-radius:9px;border:.5px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:13px;outline:none" style-focus="border-color:var(--accent);background:var(--surface)" />
      </label>

      <label style="display:flex;flex-direction:column;gap:5px">
        <span style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--hint)">Contrase&ntilde;a</span>
        <input type="password" value="{{ pass }}" onChange="{{ setPass }}" autoComplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" style="height:38px;padding:0 11px;border-radius:9px;border:.5px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:13px;outline:none" style-focus="border-color:var(--accent);background:var(--surface)" />
      </label>

      <sc-if value="{{ hayError }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:9px;background:var(--error-light);border:.5px solid var(--error)">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--error)" stroke-width="1.8" style="width:14px;height:14px;flex-shrink:0"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4M12 16h.01"></path></svg>
          <span style="font-size:11px;color:var(--error);font-weight:500;text-wrap:pretty">{{ error }}</span>
        </div>
      </sc-if>

      <button type="button" onClick="{{ toggleRecordar }}" style="display:flex;align-items:center;gap:8px;padding:0;border:none;background:none;cursor:pointer;font-family:inherit;text-align:left">
        <span style="width:16px;height:16px;flex-shrink:0;border-radius:5px;border:1.5px solid {{ marcoColor }};background:{{ marcoFondo }};display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--surface)" stroke-width="3.2" style="width:10px;height:10px;opacity:{{ tick }}"><path d="M5 13l4 4L19 7"></path></svg>
        </span>
        <span style="font-size:12px;color:var(--muted)">Mantener la sesi&oacute;n abierta en este equipo</span>
      </button>

      <button type="submit" style="height:40px;border:none;border-radius:10px;background:var(--accent);color:var(--surface);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background 150ms ease-out" style-hover="background:var(--accent-hover)">Entrar</button>

      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <a href="#" style="font-size:11px">Olvid&eacute; mi contrase&ntilde;a</a>
        <span style="font-size:10px;color:var(--hint)">servidor: crm.interno &middot; {{ estadoServidor }}</span>
      </div>
    </form>

    <div style="padding:30px 26px 26px;background:var(--bg);border-left:.5px solid var(--border);display:flex;flex-direction:column;gap:10px;min-width:0">
      <span style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--hint)">Usuarios de la demo</span>
      <div style="display:flex;flex-direction:column;gap:6px">
        <sc-for list="{{ demos }}" as="u" hint-placeholder-count="3">
          <button type="button" onClick="{{ u.usar }}" style="display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:10px;border:.5px solid var(--border);background:var(--surface);cursor:pointer;font-family:inherit;text-align:left;transition:border-color 150ms ease-out" style-hover="border-color:var(--accent);background:var(--accent-light)">
            <span style="width:26px;height:26px;flex-shrink:0;border-radius:8px;background:{{ u.color }};color:var(--surface);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ u.iniciales }}</span>
            <span style="display:flex;flex-direction:column;gap:1px;min-width:0;flex:1">
              <span style="font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ u.nombre }}</span>
              <span style="font-size:10px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ u.detalle }}</span>
            </span>
            <span style="font-size:9px;font-weight:600;padding:2px 6px;border-radius:7px;background:{{ u.chipBg }};color:{{ u.chipFg }};white-space:nowrap;flex-shrink:0">{{ u.chip }}</span>
          </button>
        </sc-for>
      </div>
      <span style="font-size:10px;color:var(--hint);line-height:1.5;text-wrap:pretty;margin-top:auto;padding-top:12px;border-top:.5px solid var(--border)">Contrase&ntilde;a de la demo: <strong style="color:var(--muted)">demo</strong>. Al tocar un usuario se completa el formulario.</span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:620}}">
class Component extends DCLogic {
  state = { email: '', pass: '', recordar: true, error: '' };

  intentar() {
    const us = this.props.usuarios || [];
    const e = (this.state.email || '').trim().toLowerCase();
    const u = us.find(x => (x.email || '').toLowerCase() === e || (x.usuario || '').toLowerCase() === e);
    if (!u) return this.setState({ error: 'No encontramos ese usuario.' });
    if ((this.state.pass || '') !== 'demo') return this.setState({ error: 'Contraseña incorrecta. En la demo es "demo".' });
    if (u.estado === 'pendiente') return this.setState({ error: 'La invitación de ' + u.nombre + ' está pendiente: todavía no fijó su contraseña.' });
    if (u.estado === 'suspendido') return this.setState({ error: 'Usuario suspendido. Pedile al administrador que lo reactive.' });
    this.setState({ error: '' });
    if (this.props.onEntrar) this.props.onEntrar(u.id, this.state.recordar);
  }

  renderVals() {
    const us = this.props.usuarios || [];
    return {
      email: this.state.email,
      pass: this.state.pass,
      recordar: this.state.recordar,
      tick: this.state.recordar ? '1' : '0',
      marcoColor: this.state.recordar ? 'var(--accent)' : 'var(--border)',
      marcoFondo: this.state.recordar ? 'var(--accent)' : 'transparent',
      error: this.state.error,
      hayError: !!this.state.error,
      estadoServidor: 'activo',
      setEmail: e => this.setState({ email: e.target.value, error: '' }),
      setPass: e => this.setState({ pass: e.target.value, error: '' }),
      toggleRecordar: () => this.setState(s => ({ recordar: !s.recordar })),
      enviar: e => { e.preventDefault(); this.intentar(); },
      demos: us.map(u => ({
        nombre: u.nombre,
        detalle: u.email,
        iniciales: (u.nombre || '').split(' ').map(p => p[0]).slice(0, 2).join(''),
        color: u.rol === 'Administrador' ? 'var(--accent)' : 'var(--muted)',
        chip: u.estado === 'activo' ? u.rol : u.estado,
        chipBg: u.estado === 'activo' ? (u.rol === 'Administrador' ? 'var(--accent-light)' : 'var(--info-light)') : (u.estado === 'pendiente' ? 'var(--warning-light)' : 'var(--error-light)'),
        chipFg: u.estado === 'activo' ? (u.rol === 'Administrador' ? 'var(--accent)' : 'var(--muted)') : (u.estado === 'pendiente' ? 'var(--warning)' : 'var(--error)'),
        usar: () => this.setState({ email: u.email, pass: 'demo', error: '' })
      }))
    };
  }
}

</script>
</body>
</html>
