<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:220;display:flex;align-items:center;justify-content:center" onClick="{{ cerrar }}">
  <div style="width:480px;max-width:94vw;max-height:84vh;background:var(--surface);border:.5px solid var(--border);border-radius:12px;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;animation:om-agendada 240ms cubic-bezier(.4,0,.2,1)" onClick="{{ stop }}">
    <div style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:.5px solid var(--border)">
      <sc-if value="{{ tieneFoto }}" hint-placeholder-val="{{ false }}">
        <span style="width:30px;height:30px;flex-shrink:0;border-radius:50%;border:.5px solid var(--accent-br);overflow:hidden;display:block">
          <img src="{{ foto }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block" />
        </span>
      </sc-if>
      <sc-if value="{{ sinFoto }}" hint-placeholder-val="{{ true }}">
        <span style="width:30px;height:30px;flex-shrink:0;border-radius:50%;border:.5px dashed var(--border);background:var(--bg);color:var(--hint);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center">{{ iniciales }}</span>
      </sc-if>
      <span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;background:var(--accent);color:var(--surface);white-space:nowrap;flex-shrink:0">{{ cuenta }}</span>
      <button type="button" onClick="{{ irPerfil }}" title="Abrir la ficha en la columna 2" style="flex:1;min-width:0;text-align:left;border:none;background:transparent;padding:0;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ nombre }}</button>
      <span style="font-size:9px;color:var(--hint);padding:1px 6px;border-radius:8px;border:.5px solid var(--border);white-space:nowrap;flex-shrink:0">{{ origen }}</span>
      <button type="button" onClick="{{ cerrar }}" title="Cerrar" style="width:26px;height:26px;flex-shrink:0;border-radius:8px;border:.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background 150ms ease-out" style-hover="background:var(--bg);color:var(--text)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:12px;height:12px"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <div style="min-height:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        <sc-for list="{{ datos }}" as="d" hint-placeholder-count="4">
          <span style="display:inline-flex;align-items:baseline;gap:6px;padding:3px 9px;border-radius:8px;background:var(--bg);border:.5px solid var(--border);white-space:nowrap">
            <span style="font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);font-weight:600">{{ d.label }}</span>
            <span style="font-size:11px;color:var(--text)">{{ d.value }}</span>
          </span>
        </sc-for>
      </div>

      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <a href="{{ linkPerfil }}" target="_blank" title="Perfil de LinkedIn" style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;border:.5px solid var(--border);background:transparent;color:var(--muted);text-decoration:none;white-space:nowrap;transition:background 150ms ease-out" style-hover="background:var(--accent-light);border-color:var(--accent-br);color:var(--accent)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:12px;height:12px"><path d="M7 17L17 7M17 7h-7M17 7v7"></path></svg>
          <span style="font-size:10px;font-weight:500">LinkedIn</span>
        </a>
        <a href="{{ linkWhatsapp }}" target="_blank" title="Conversación de WhatsApp" style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;border:.5px solid var(--border);background:transparent;color:var(--muted);text-decoration:none;white-space:nowrap;transition:background 150ms ease-out" style-hover="background:var(--success-light);border-color:var(--success);color:var(--brand-whatsapp)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:12px;height:12px"><path d="M20 15a3 3 0 01-3 3H8l-4 3V6a3 3 0 013-3h10a3 3 0 013 3z"></path></svg>
          <span style="font-size:10px;font-weight:500">WhatsApp</span>
        </a>
        <button type="button" onClick="{{ toggleNotas }}" title="Notas de la reunión" style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;border:.5px solid var(--border);background:transparent;color:{{ colorNotas }};cursor:pointer;font-family:inherit;white-space:nowrap;transition:background 150ms ease-out" style-hover="background:var(--accent-light);border-color:var(--accent-br)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:12px;height:12px"><path d="M5 4h14v12l-4 4H5z"></path><path d="M8 9h8M8 13h5"></path></svg>
          <span style="font-size:10px;font-weight:500">Notas</span>
        </button>
        <button type="button" onClick="{{ toggleHist }}" title="Histórico de reuniones" style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;border:.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;white-space:nowrap;transition:background 150ms ease-out" style-hover="background:var(--accent-light);border-color:var(--accent-br);color:var(--accent)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:12px;height:12px"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
          <span style="font-size:10px;font-weight:500">{{ nHistorial }}</span>
        </button>
      </div>

      <sc-if value="{{ notasAbiertas }}" hint-placeholder-val="{{ false }}">
        <textarea value="{{ notas }}" onChange="{{ escribirNotas }}" placeholder="Notas de la reunión…" style="width:100%;box-sizing:border-box;min-height:64px;padding:8px 10px;border:.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:12px;line-height:1.55;font-family:inherit;resize:vertical;outline:none;animation:om-abrir 150ms ease-out;transition:border-color 150ms ease-out" style-focus="border-color:var(--accent)"></textarea>
      </sc-if>

      <sc-if value="{{ histAbierto }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:2px;border:.5px solid var(--border);border-radius:8px;padding:6px;animation:om-abrir 150ms ease-out">
          <sc-for list="{{ historial }}" as="h" hint-placeholder-count="2">
            <div style="display:flex;align-items:center;gap:7px;padding:4px 6px">
              <span style="font-size:11px;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap">{{ h.cuando }}</span>
              <sc-if value="{{ h.asistio }}" hint-placeholder-val="{{ true }}">
                <span style="font-size:9px;font-weight:600;padding:1px 6px;border-radius:8px;background:var(--success-light);color:var(--success);white-space:nowrap">{{ h.resultado }}</span>
              </sc-if>
              <sc-if value="{{ h.otro }}" hint-placeholder-val="{{ false }}">
                <span style="font-size:9px;font-weight:600;padding:1px 6px;border-radius:8px;background:var(--error-light);color:var(--error);white-space:nowrap">{{ h.resultado }}</span>
              </sc-if>
            </div>
          </sc-for>
          <sc-if value="{{ sinHistorial }}" hint-placeholder-val="{{ false }}">
            <span style="font-size:11px;color:var(--hint);padding:8px 6px;text-align:center">sin reuniones previas</span>
          </sc-if>
        </div>
      </sc-if>

      <div style="display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:.5px solid var(--border)">
        <span style="font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);font-weight:600">Cambiar la reuni&oacute;n</span>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:5px">
            <span style="font-size:10px;color:var(--muted);white-space:nowrap">Fecha</span>
            <input type="date" value="{{ fechaElegida }}" onChange="{{ setFecha }}" style="height:28px;padding:0 6px;border:.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:11px;font-family:inherit;font-variant-numeric:tabular-nums;outline:none" />
          </label>
          <label style="display:flex;align-items:center;gap:5px">
            <span style="font-size:10px;color:var(--muted);white-space:nowrap">Hora</span>
            <input type="time" value="{{ horaElegida }}" onChange="{{ setHora }}" step="900" style="height:28px;padding:0 6px;border:.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:11px;font-family:inherit;font-variant-numeric:tabular-nums;outline:none" />
          </label>
          <span style="font-size:9px;color:var(--hint);white-space:nowrap">{{ originalLabel }}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <sc-if value="{{ avisado }}" hint-placeholder-val="{{ false }}">
            <span style="display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:600;padding:2px 7px;border-radius:10px;background:var(--success-light);color:var(--success);border:.5px solid var(--success);white-space:nowrap;animation:om-agendada 300ms cubic-bezier(.4,0,.2,1)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="width:9px;height:9px"><path d="M5 13l4 4L19 7"></path></svg>Google Calendar avisado
            </span>
          </sc-if>
          <sc-if value="{{ puedeMover }}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{ mover }}" style="margin-left:auto;height:28px;padding:0 14px;border-radius:8px;border:none;background:var(--accent);color:var(--surface);font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background 150ms ease-out" style-hover="background:var(--accent-hover)">Guardar y notificar</button>
          </sc-if>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:520},&quot;evento&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;contacto&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;onIrPerfil&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string)=&gt;void&quot;},&quot;onMover&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string,hora:string)=&gt;void&quot;},&quot;onCerrar&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { notasAbiertas: false, histAbierto: false, nueva: null, nuevaFecha: null, notas: null, avisado: false };

  static hhmm(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
  static dm(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : ''; }

  renderVals() {
    const e = this.props.evento || {};
    const c = this.props.contacto || {};
    const tel = (c.telefono || '').replace(/\D/g, '');
    const base = e.hora || '09:00';
    const nueva = this.state.nueva;
    const notas = this.state.notas !== null ? this.state.notas : (e.notas || '');
    const hist = c.historial || [];
    const fecha = this.state.nuevaFecha !== null ? this.state.nuevaFecha : (e.fecha || '');
    const cambio = (nueva && nueva !== base) || (fecha && fecha !== e.fecha);

    return {
      cuenta: c.cuentaAbrev || e.cuenta || '—',
      tieneFoto: !!e.foto,
      sinFoto: !e.foto,
      foto: e.foto || '',
      iniciales: (function (n) {
        const p = (n || '').trim().split(/\s+/);
        return (p[0] || '?').charAt(0).toUpperCase() + (p.length > 1 ? p[p.length - 1].charAt(0).toUpperCase() : '');
      })(c.nombre),
      nombre: c.nombre || e.titulo || '',
      origen: e.origenCrm ? 'agendada desde el CRM' : 'evento de Google Calendar',
      datos: [
        { label: 'Fecha', value: Component.dm(e.fecha) },
        { label: 'Hora', value: base + (e.duracion ? ' · ' + e.duracion + ' min' : '') },
        { label: 'Empresa', value: c.empresa || 'sin empresa' },
        { label: 'Ciudad', value: c.ciudad || '—' },
        { label: 'Estado', value: e.estado === 'asistio' ? 'asistió' : (e.estado === 'no-asistio' ? 'no asistió' : 'agendada') }
      ],
      linkPerfil: c.linkPerfil || '#',
      linkWhatsapp: tel ? 'https://wa.me/' + tel : '#',
      irPerfil: () => { if (this.props.onIrPerfil) this.props.onIrPerfil(c.id || e.id); },

      notasAbiertas: this.state.notasAbiertas,
      toggleNotas: () => this.setState(s => ({ notasAbiertas: !s.notasAbiertas })),
      colorNotas: notas ? 'var(--accent)' : 'var(--muted)',
      notas,
      escribirNotas: ev => this.setState({ notas: ev.target.value }),

      histAbierto: this.state.histAbierto,
      toggleHist: () => this.setState(s => ({ histAbierto: !s.histAbierto })),
      nHistorial: hist.length ? hist.length + ' reuniones' : 'histórico',
      sinHistorial: hist.length === 0,
      historial: hist.map(h => ({
        cuando: Component.dm(h.fecha) + (h.hora ? ' · ' + h.hora : ''),
        resultado: h.resultado,
        asistio: h.resultado === 'asistió',
        otro: h.resultado !== 'asistió'
      })),

      horaActual: base,
      horaElegida: nueva || base,
      fechaElegida: fecha,
      setHora: ev => this.setState({ nueva: ev.target.value, avisado: false }),
      setFecha: ev => this.setState({ nuevaFecha: ev.target.value, avisado: false }),
      originalLabel: 'original: ' + Component.dm(e.fecha) + ' · ' + base,
      puedeMover: !!cambio,
      avisado: this.state.avisado,
      mover: () => {
        if (this.props.onMover) this.props.onMover(e.id || (c.id || ''), nueva || base, fecha);
        this.setState({ avisado: true });
      },

      stop: ev => ev.stopPropagation(),
      cerrar: () => { if (this.props.onCerrar) this.props.onCerrar(); }
    };
  }
}
</script>
</body>
</html>
