<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center" onClick="{{ cerrar }}">
  <div style="width:480px;max-width:94vw;background:var(--surface);border:.5px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden" onClick="{{ stop }}">
    <div style="display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:.5px solid var(--border)">
      <span style="font-size:14px;font-weight:500;color:var(--text)">Confirmar reuni&oacute;n</span>
      <span style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--accent-light);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums">{{ cuando }}</span>
      <button type="button" onClick="{{ cerrar }}" title="Cerrar" style="margin-left:auto;width:28px;height:28px;border-radius:8px;border:.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;transition:background 150ms ease-out" style-hover="background:var(--accent);border-color:var(--accent-br);color:var(--surface)">&#215;</button>
    </div>

    <div style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">
      <span style="font-size:11px;color:var(--muted);line-height:1.5;text-wrap:pretty">Se env&iacute;a la invitaci&oacute;n con el evento a estos correos. El primero viene del perfil.</span>
      <sc-for list="{{ campos }}" as="c" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);width:60px;flex-shrink:0;white-space:nowrap">{{ c.label }}</span>
          <input type="email" value="{{ c.value }}" onChange="{{ c.set }}" placeholder="{{ c.placeholder }}" style="flex:1;min-width:0;height:32px;padding:0 10px;border:.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:12px;font-family:inherit;outline:none;transition:border-color 150ms ease-out" style-focus="border-color:var(--accent)" />
        </div>
      </sc-for>
      <sc-if value="{{ sinEmailPerfil }}" hint-placeholder-val="{{ false }}">
        <span style="font-size:10px;color:var(--warning);background:var(--warning-light);border:.5px solid var(--warning);border-radius:8px;padding:6px 10px;line-height:1.5">El perfil no tiene email guardado. El que carg&aacute;s ac&aacute; queda en la ficha.</span>
      </sc-if>
    </div>

    <div style="display:flex;align-items:center;gap:8px;padding:0 16px 14px">
      <span style="font-size:10px;color:var(--hint)">{{ conteo }}</span>
      <button type="button" onClick="{{ cerrar }}" style="margin-left:auto;height:28px;padding:0 14px;border-radius:8px;border:.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;transition:background 150ms ease-out" style-hover="background:var(--bg)">Cancelar</button>
      <sc-if value="{{ puedeEnviar }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ enviar }}" style="height:28px;padding:0 16px;border-radius:8px;border:none;background:var(--accent);color:var(--surface);font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;transition:background 150ms ease-out" style-hover="background:var(--accent-hover)">Enviar y confirmar</button>
      </sc-if>
      <sc-if value="{{ bloqueado }}" hint-placeholder-val="{{ false }}">
        <span style="height:28px;padding:0 16px;border-radius:8px;background:var(--accent);color:var(--surface);font-size:11px;font-weight:500;display:flex;align-items:center;opacity:.4;cursor:not-allowed">Enviar y confirmar</span>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:620,&quot;height&quot;:360},&quot;emails&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;fecha&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026-09-17&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hora&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;15:00&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;duracion&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;tsType&quot;:&quot;number&quot;},&quot;onEnviar&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(m:string[])=&gt;void&quot;},&quot;onCerrar&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { mails: null };
  get mails() {
    if (this.state.mails) return this.state.mails;
    return (this.props.emails || []).filter(Boolean).concat(['', '']);
  }
  renderVals() {
    const m = this.mails;
    const validos = m.filter(x => x && x.includes('@'));
    const f = this.props.fecha || '';
    return {
      cuando: (f ? f.slice(8, 10) + '/' + f.slice(5, 7) : '') + (this.props.hora ? ' · ' + this.props.hora : '') + (this.props.duracion ? ' · ' + this.props.duracion + ' min' : ''),
      sinEmailPerfil: (this.props.emails || []).filter(Boolean).length === 0,
      campos: m.map((v, i) => ({
        label: i === 0 ? 'Principal' : 'Copia ' + i,
        value: v || '',
        placeholder: i === 0 ? 'nombre@empresa.com' : 'opcional',
        set: e => {
          const next = this.mails.slice();
          next[i] = e.target.value;
          this.setState({ mails: next });
        }
      })),
      conteo: validos.length ? validos.length + ' destinatario' + (validos.length > 1 ? 's' : '') : 'falta al menos un correo',
      puedeEnviar: validos.length > 0,
      bloqueado: validos.length === 0,
      enviar: () => { if (this.props.onEnviar) this.props.onEnviar(validos); },
      stop: ev => ev.stopPropagation(),
      cerrar: () => { if (this.props.onCerrar) this.props.onCerrar(); }
    };
  }
}
</script>
</body>
</html>
