<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:.5px solid var(--border);border-radius:12px;overflow:hidden">
  <div style="display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;flex-shrink:0">
    <button type="button" onClick="{{ toggle }}" style="display:flex;align-items:center;gap:7px;padding:0;background:transparent;border:none;cursor:pointer;font-family:inherit;min-width:0;flex:1;text-align:left">
      <sc-if value="{{ abierto }}" hint-placeholder-val="{{ true }}">
        <span style="font-size:9px;color:var(--hint);width:10px;flex-shrink:0">&#9662;</span>
      </sc-if>
      <sc-if value="{{ cerrado }}" hint-placeholder-val="{{ false }}">
        <span style="font-size:9px;color:var(--hint);width:10px;flex-shrink:0">&#9656;</span>
      </sc-if>
      <span style="font-size:11px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap">Conversaci&oacute;n</span>
      <sc-if value="{{ soloWa }}" hint-placeholder-val="{{ false }}">
        <span style="font-size:9px;font-weight:600;padding:1px 6px;border-radius:8px;background:var(--success-light);color:var(--brand-whatsapp);white-space:nowrap">WhatsApp</span>
      </sc-if>
      <sc-if value="{{ soloLi }}" hint-placeholder-val="{{ false }}">
        <span style="font-size:9px;font-weight:600;padding:1px 6px;border-radius:8px;background:var(--brand-linkedin-light);color:var(--brand-linkedin);white-space:nowrap">LinkedIn</span>
      </sc-if>
      <span style="font-size:10px;color:var(--hint);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">{{ meta }}</span>
    </button>
    <sc-if value="{{ switchVisible }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;gap:0;border:.5px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0">
      <sc-for list="{{ canales }}" as="c" hint-placeholder-count="2">
        <sc-if value="{{ c.onLi }}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{ c.elegir }}" style="height:26px;padding:0 12px;border:none;background:var(--brand-linkedin);color:var(--surface);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap">{{ c.label }}</button>
        </sc-if>
        <sc-if value="{{ c.onWa }}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{ c.elegir }}" style="height:26px;padding:0 12px;border:none;background:var(--brand-whatsapp);color:var(--surface);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap">{{ c.label }}</button>
        </sc-if>
        <sc-if value="{{ c.off }}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{ c.elegir }}" style="height:26px;padding:0 12px;border:none;background:var(--bg);color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background 150ms ease-out" style-hover="background:var(--accent-light);color:var(--accent)">{{ c.label }}</button>
        </sc-if>
      </sc-for>
    </div>
    </sc-if>
  </div>
  <sc-if value="{{ abierto }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;gap:4px;padding:8px 10px;border-top:.5px solid var(--border);max-height:260px;overflow-y:auto">
      <sc-for list="{{ mensajes }}" as="m" hint-placeholder-count="3">
        <sc-if value="{{ m.esFecha }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;justify-content:center;padding:4px 0">
            <span style="font-size:9px;font-weight:600;color:var(--hint);background:var(--bg);border:.5px solid var(--border);border-radius:8px;padding:2px 8px;letter-spacing:.04em">{{ m.fechaLabel }}</span>
          </div>
        </sc-if>
        <sc-if value="{{ m.nuevo }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;justify-content:flex-start">
            <div style="max-width:78%;padding:6px 10px 16px;border-radius:2px 8px 8px 8px;background:var(--warning-light);color:var(--text);border:.5px solid var(--warning);border-left:3px solid var(--warning);font-size:12px;line-height:1.45;position:relative;overflow-wrap:break-word;text-wrap:pretty">
              <span style="display:block;font-size:9px;font-weight:700;color:var(--warning);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px">nuevo</span>
              {{ m.txt }}
              <span style="position:absolute;bottom:2px;right:8px;font-size:9px;color:var(--hint);font-variant-numeric:tabular-nums">{{ m.hora }}</span>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{ m.entrante }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;justify-content:flex-start">
            <div style="max-width:78%;padding:6px 10px 16px;border-radius:2px 8px 8px 8px;background:var(--bg);color:var(--text);border:.5px solid var(--border);font-size:12px;line-height:1.45;position:relative;overflow-wrap:break-word;text-wrap:pretty">
              {{ m.txt }}
              <span style="position:absolute;bottom:2px;right:8px;font-size:9px;color:var(--hint);font-variant-numeric:tabular-nums">{{ m.hora }}</span>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{ m.salienteLi }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;justify-content:flex-end">
            <div style="max-width:78%;padding:6px 10px 16px;border-radius:8px 2px 8px 8px;background:var(--brand-linkedin-light);color:var(--brand-linkedin);border:.5px solid var(--brand-linkedin-br);font-size:12px;line-height:1.45;position:relative;overflow-wrap:break-word;text-wrap:pretty">
              {{ m.txt }}
              <span style="position:absolute;bottom:2px;right:8px;font-size:9px;color:var(--brand-linkedin);opacity:.75;font-variant-numeric:tabular-nums">{{ m.hora }}</span>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{ m.salienteWa }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;justify-content:flex-end">
            <div style="max-width:78%;padding:6px 10px 16px;border-radius:8px 2px 8px 8px;background:var(--success-light);color:var(--brand-whatsapp);border:.5px solid var(--teal-br);font-size:12px;line-height:1.45;position:relative;overflow-wrap:break-word;text-wrap:pretty">
              {{ m.txt }}
              <span style="position:absolute;bottom:2px;right:8px;display:inline-flex;align-items:center;gap:3px;font-size:9px;color:var(--brand-whatsapp);opacity:.8;font-variant-numeric:tabular-nums">
                {{ m.hora }}
                <sc-if value="{{ m.leido }}" hint-placeholder-val="{{ false }}">
                  <span title="Leído" style="display:inline-flex;color:var(--brand-whatsapp)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:11px;height:8px"><path d="M1 12l4 4 8-9M9 14l2 2 8-9"></path></svg>
                  </span>
                </sc-if>
                <sc-if value="{{ m.entregado }}" hint-placeholder-val="{{ false }}">
                  <span title="Entregado" style="display:inline-flex;color:var(--hint)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:11px;height:8px"><path d="M1 12l4 4 8-9M9 14l2 2 8-9"></path></svg>
                  </span>
                </sc-if>
                <sc-if value="{{ m.enviado }}" hint-placeholder-val="{{ false }}">
                  <span title="Enviado" style="display:inline-flex;color:var(--hint)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:9px;height:8px"><path d="M4 12l4 4 9-10"></path></svg>
                  </span>
                </sc-if>
              </span>
            </div>
          </div>
        </sc-if>
      </sc-for>
      <sc-if value="{{ vacia }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 0">
          <span style="font-size:11px;color:var(--hint);text-align:center;text-wrap:pretty">{{ mensajeVacio }}</span>
          <sc-if value="{{ puedeIniciarWa }}" hint-placeholder-val="{{ false }}">
            <a href="{{ linkWa }}" target="_blank" style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:8px;border:.5px solid var(--brand-whatsapp);background:var(--success-light);color:var(--brand-whatsapp);font-size:10px;font-weight:600;text-decoration:none;white-space:nowrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width:12px;height:12px"><path d="M20 15a3 3 0 01-3 3H8l-4 3V6a3 3 0 013-3h10a3 3 0 013 3z"></path></svg>
              Escribir el primer mensaje
            </a>
          </sc-if>
        </div>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:620,&quot;height&quot;:300},&quot;mensajesLi&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;},&quot;mensajesWa&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;},&quot;canalFijo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;LinkedIn&quot;,&quot;WhatsApp&quot;],&quot;default&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;telefono&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;hayNuevos&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { abierto: null, canal: 'LinkedIn' };
  componentDidUpdate(prev) {
    if (prev.contactoId !== this.props.contactoId) this.setState({ abierto: null, canal: 'LinkedIn' });
  }
  get abierto() { return this.state.abierto !== null ? this.state.abierto : true; }
  get canal() { return this.props.canalFijo || this.state.canal; }
  renderVals() {
    const li = this.props.mensajesLi || [];
    const wa = this.props.mensajesWa || [];
    const canal = this.canal;
    const activo = canal === 'LinkedIn' ? li : wa;
    const ult = activo.length ? activo[activo.length - 1].hora : '';
    return {
      abierto: this.abierto,
      cerrado: !this.abierto,
      switchVisible: !this.props.canalFijo,
      soloWa: this.props.canalFijo === 'WhatsApp',
      soloLi: this.props.canalFijo === 'LinkedIn',
      toggle: () => this.setState({ abierto: !this.abierto }),
      canales: [
        { label: 'LinkedIn', corto: 'in', n: li.length },
        { label: 'WhatsApp', corto: 'wa', n: wa.length }
      ].map(c => ({
        label: c.corto + ' ' + c.n,
        onLi: canal === c.label && c.label === 'LinkedIn',
        onWa: canal === c.label && c.label === 'WhatsApp',
        off: canal !== c.label,
        elegir: () => this.setState({ canal: c.label })
      })),
      meta: activo.length ? ult : '',
      vacia: activo.length === 0,
      puedeIniciarWa: activo.length === 0 && canal === 'WhatsApp' && !!(this.props.telefono || '').replace(/\D/g, ''),
      linkWa: 'https://wa.me/' + (this.props.telefono || '').replace(/\D/g, ''),
      mensajeVacio: canal === 'WhatsApp'
        ? ((this.props.telefono || '').replace(/\D/g, '') ? 'Todavía no hay WhatsApp con este lead' : 'Sin teléfono cargado: no hay WhatsApp posible')
        : 'Sin conversación en LinkedIn',
      mensajes: (function (self) {
        const out = [];
        let dia = '';
        let ultimoOut = -1;
        activo.forEach((m, k) => { if (m.quien === 'out') ultimoOut = k; });
        const marcarNuevos = self.props.hayNuevos === true;
        activo.forEach((m, k) => {
          const partes = (m.hora || '').split(' ');
          const d = partes.length > 1 ? partes[0] : '';
          if (d && d !== dia) { out.push({ esFecha: true, fechaLabel: d, entrante: false, nuevo: false, salienteLi: false, salienteWa: false }); dia = d; }
          const entrante = m.quien !== 'out';
          const nuevo = entrante && marcarNuevos && k > ultimoOut;
          out.push({
            esFecha: false,
            txt: m.txt,
            hora: partes.length > 1 ? partes[1] : (m.hora || ''),
            entrante: entrante && !nuevo,
            nuevo,
            salienteLi: m.quien === 'out' && canal === 'LinkedIn',
            salienteWa: m.quien === 'out' && canal === 'WhatsApp',
            enviado: m.ack === 'enviado',
            entregado: m.ack === 'entregado',
            leido: m.ack === 'leido'
          });
        });
        return out;
      })(this)
    };
  }
}
</script>
</body>
</html>
