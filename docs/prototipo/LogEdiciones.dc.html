<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center" onClick="{{ cerrarFondo }}">
  <div style="width:560px;max-width:94vw;max-height:82vh;background:var(--surface);border:.5px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden" onClick="{{ stop }}">
    <div style="display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:.5px solid var(--border)">
      <span style="font-size:14px;font-weight:500;color:var(--text)">Log de ediciones</span>
      <span style="font-size:11px;color:var(--hint)">{{ subtitulo }}</span>
      <button type="button" onClick="{{ cerrar }}" title="Cerrar" style="margin-left:auto;width:28px;height:28px;border-radius:8px;border:.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit" style-hover="background:var(--accent);border-color:var(--accent-br);color:var(--surface)">&#215;</button>
    </div>
    <div style="flex:1;overflow-y:auto;padding:4px 0">
      <sc-for list="{{ entradas }}" as="e" hint-placeholder-count="5">
        <div style="display:grid;grid-template-columns:110px 1fr auto;gap:2px 12px;padding:8px 16px;border-bottom:.5px solid var(--border);align-items:start">
          <div style="font-size:10px;color:var(--hint);font-variant-numeric:tabular-nums;padding-top:2px">{{ e.fecha }}</div>
          <div style="min-width:0;display:flex;flex-direction:column;gap:3px">
            <div style="font-size:11px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:.04em">{{ e.campo }}</div>
            <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap">
              <sc-if value="{{ e.teniaAntes }}" hint-placeholder-val="{{ true }}">
                <span style="font-size:12px;color:var(--hint);text-decoration:line-through;overflow-wrap:break-word">{{ e.antes }}</span>
              </sc-if>
              <sc-if value="{{ e.vacioAntes }}" hint-placeholder-val="{{ false }}">
                <span style="font-size:11px;color:var(--hint);font-style:italic">vac&iacute;o</span>
              </sc-if>
              <span style="font-size:10px;color:var(--hint)">&#8594;</span>
              <span style="font-size:12px;color:var(--text);overflow-wrap:break-word;text-wrap:pretty">{{ e.despues }}</span>
            </div>
          </div>
          <sc-if value="{{ e.puedeRevertir }}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{ e.revertir }}" title="{{ e.tituloRevertir }}" style="height:24px;padding:0 9px;border-radius:8px;border:.5px solid var(--border);background:transparent;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background 150ms ease-out" style-hover="background:var(--warning-light);border-color:var(--warning);color:var(--warning)">revertir</button>
          </sc-if>
          <sc-if value="{{ e.noRevertible }}" hint-placeholder-val="{{ false }}">
            <span title="Este campo no se puede revertir desde el log" style="font-size:9px;color:var(--hint);padding-top:4px;white-space:nowrap">sin revertir</span>
          </sc-if>
        </div>
      </sc-for>
      <sc-if value="{{ vacio }}" hint-placeholder-val="{{ false }}">
        <div style="padding:20px 16px;font-size:11px;color:var(--hint);text-align:center">sin ediciones registradas en este perfil</div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:700,&quot;height&quot;:420},&quot;entradas&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{fecha:string,campo:string,antes:string,despues:string}[]&quot;},&quot;onRevertir&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i:number)=&gt;void&quot;},&quot;onCerrar&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const ent = this.props.entradas || [];
    return {
      subtitulo: ent.length ? ent.length + ' cambios' : '',
      vacio: ent.length === 0,
      entradas: ent.map((e, i) => ({
        fecha: e.fecha,
        campo: e.campo,
        antes: e.antes || '',
        teniaAntes: !!e.antes,
        vacioAntes: !e.antes,
        despues: e.despues,
        puedeRevertir: !!e.puedeRevertir,
        noRevertible: !e.puedeRevertir,
        tituloRevertir: 'Volver ' + e.campo + ' a ' + (e.antes ? '«' + e.antes + '»' : 'vacío'),
        revertir: () => { if (this.props.onRevertir) this.props.onRevertir(e.indice !== undefined ? e.indice : i); }
      })),
      stop: ev => ev.stopPropagation(),
      cerrar: () => { if (this.props.onCerrar) this.props.onCerrar(); },
      cerrarFondo: () => { if (this.props.onCerrar) this.props.onCerrar(); }
    };
  }
}
</script>
</body>
</html>
