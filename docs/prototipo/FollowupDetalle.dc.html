<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:1;height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);min-width:0">

  <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;align-items:flex-start;padding:8px 14px 9px;border-bottom:.5px solid var(--border);flex-shrink:0;position:relative;z-index:5">
    <sc-if value="{{ tieneFoto }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ pegarFoto }}" title="Pegar otra imagen del portapapeles" style="width:30px;height:30px;flex-shrink:0;border-radius:50%;border:.5px solid var(--accent-br);padding:0;overflow:hidden;cursor:pointer;background:transparent">
        <img src="{{ foto }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block" />
      </button>
    </sc-if>
    <sc-if value="{{ sinFoto }}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{ pegarFoto }}" title="Copiá una imagen y tocá acá para pegarla" style="width:30px;height:30px;flex-shrink:0;border-radius:50%;border:.5px dashed var(--border);background:var(--bg);color:var(--hint);font-size:10px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:border-color 150ms ease-out" style-hover="border-color:var(--accent);color:var(--accent)">{{ iniciales }}</button>
    </sc-if>

    <span title="Cuenta de LinkedIn" style="font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:8px;background:var(--accent);color:var(--surface);flex-shrink:0;white-space:nowrap">{{ cuenta }}</span>

    <sc-if value="{{ conAsignacion }}" hint-placeholder-val="{{ false }}">
      <div style="position:relative;flex-shrink:0">
        <button type="button" onClick="{{ toggleAsignar }}" title="Asignar este lead a un usuario" style="display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:8px;border:.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;transition:background 150ms ease-out" style-hover="background:var(--accent-light);border-color:var(--accent-br);color:var(--accent)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width:12px;height:12px;flex-shrink:0"><circle cx="12" cy="8" r="3.4"></circle><path d="M5 20a7 7 0 0114 0"></path></svg>
          <span style="font-size:10px;font-weight:600;white-space:nowrap">{{ duenioLabel }}</span>
        </button>
        <sc-if value="{{ asignarAbierto }}" hint-placeholder-val="{{ false }}">
          <div style="position:fixed;inset:0;z-index:59;background:transparent" onClick="{{ cerrarAsignar }}"></div>
          <div style="position:absolute;top:calc(100% + 6px);left:0;z-index:60;width:210px;background:var(--surface);border:.5px solid var(--border);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:7px;display:flex;flex-direction:column;gap:2px;animation:om-abrir 140ms ease-out">
            <span style="font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);font-weight:600;padding:2px 6px">Asignar a</span>
            <sc-for list="{{ asignables }}" as="a" hint-placeholder-count="3">
              <button type="button" onClick="{{ a.elegir }}" style="display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:8px;border:none;background:{{ a.fondo }};cursor:pointer;font-family:inherit;text-align:left;transition:background 150ms ease-out" style-hover="background:var(--bg)">
                <span style="width:18px;height:18px;flex-shrink:0;border-radius:6px;background:{{ a.color }};color:var(--surface);font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ a.iniciales }}</span>
                <span style="font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0">{{ a.nombre }}</span>
                <sc-if value="{{ a.actual }}" hint-placeholder-val="{{ false }}">
                  <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.6" style="width:11px;height:11px;flex-shrink:0"><path d="M5 13l4 4L19 7"></path></svg>
                </sc-if>
              </button>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <button type="button" onClick="{{ abrirLog }}" title="Log de ediciones del perfil" style="width:26px;height:26px;flex-shrink:0;border-radius:8px;border:.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;transition:background 150ms ease-out" style-hover="background:var(--accent-light);border-color:var(--accent-br);color:var(--accent)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:13px;height:13px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
    </button>

    <sc-if value="{{ hayDeshacer }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ deshacer }}" title="{{ tituloDeshacer }}" style="height:26px;flex-shrink:0;padding:0 8px;border-radius:8px;border:.5px solid var(--warning);background:var(--warning-light);color:var(--warning);cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;max-width:190px;transition:background 150ms ease-out" style-hover="background:var(--warning);color:var(--surface)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:13px;height:13px;flex-shrink:0"><path d="M4 9h11a4 4 0 010 8h-6"></path><path d="M8 5L4 9l4 4"></path></svg>
        <span style="font-size:10px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ etiquetaDeshacer }}</span>
      </button>
    </sc-if>

    <div style="flex:0 1 auto;min-width:0;line-height:1.35">
    <span style="font-size:14px;font-weight:600;color:var(--text);overflow-wrap:break-word;text-wrap:pretty;letter-spacing:-.01em;display:inline">{{ nombre }}</span>

    <span style="position:relative;display:inline-flex;vertical-align:middle;margin-left:6px" onMouseEnter="{{ verInfo }}" onMouseLeave="{{ ocultarInfo }}">
      <span style="width:18px;height:18px;border-radius:50%;border:.5px solid var(--border);color:var(--hint);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:help">i</span>
      <sc-if value="{{ infoVisible }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;top:calc(100% + 5px);left:0;z-index:60;width:250px;background:var(--surface);border:.5px solid var(--border);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;animation:om-abrir 140ms ease-out">
          <sc-for list="{{ hitos }}" as="h" hint-placeholder-count="4">
            <span style="font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);font-weight:600;white-space:nowrap">{{ h.label }}</span>
            <span style="font-size:11px;color:var(--text);font-variant-numeric:tabular-nums;text-wrap:pretty">{{ h.value }}</span>
          </sc-for>
        </div>
      </sc-if>
    </span>
    </div>

    <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;white-space:nowrap">
    <a href="{{ linkPerfil }}" target="_blank" title="Abrir perfil de LinkedIn" style="width:26px;height:26px;flex-shrink:0;border-radius:8px;border:.5px solid var(--border);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;text-decoration:none;transition:background 150ms ease-out" style-hover="background:var(--accent-light);border-color:var(--accent-br);color:var(--accent)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:13px;height:13px"><path d="M7 17L17 7M17 7h-7M17 7v7"></path></svg>
    </a>

    <div style="position:relative;flex-shrink:0">
      <button type="button" onClick="{{ toggleLinks }}" title="Editar links de perfil y chat" style="width:26px;height:26px;border-radius:8px;border:.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background 150ms ease-out" style-hover="background:var(--accent-light);border-color:var(--accent-br);color:var(--accent)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width:13px;height:13px"><path d="M4 20h4L20 8l-4-4L4 16v4z"></path></svg>
      </button>
      <sc-if value="{{ linksAbierto }}" hint-placeholder-val="{{ false }}">
        <dc-import name="EditarLinks" linkPerfil="{{ linkPerfil }}" linkChat="{{ linkChat }}" onGuardar="{{ guardarLinks }}" onCerrar="{{ cerrarLinks }}" hint-size="0,0"></dc-import>
      </sc-if>
    </div>

    <div style="position:relative;flex-shrink:0">
      <button type="button" onClick="{{ toggleEtiquetas }}" title="Etiquetas del perfil" style="height:26px;padding:0 8px;border-radius:8px;border:.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;transition:background 150ms ease-out" style-hover="background:var(--accent-light);border-color:var(--accent-br);color:var(--accent)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width:13px;height:13px"><path d="M20 12l-8 8-8-8V4h8l8 8z"></path><circle cx="8.5" cy="8.5" r="1.2"></circle></svg>
        <span style="font-size:10px;font-weight:600;font-variant-numeric:tabular-nums">{{ nEtiquetas }}</span>
      </button>
      <sc-if value="{{ etiquetasAbierto }}" hint-placeholder-val="{{ false }}">
        <dc-import name="PanelEtiquetas" etiquetas="{{ catalogo }}" aplicadas="{{ aplicadas }}" onChange="{{ setAplicadas }}" onCerrar="{{ cerrarEtiquetas }}" hint-size="0,0"></dc-import>
      </sc-if>
    </div>

    <div style="position:relative;flex-shrink:0">
      <button type="button" onClick="{{ abrirAnalisis }}" title="Análisis del perfil con IA" style="width:26px;height:26px;border-radius:8px;border:.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background 150ms ease-out" style-hover="background:var(--accent-light);border-color:var(--accent-br);color:var(--accent)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width:13px;height:13px"><path d="M4 20V10M10 20V4M16 20v-7M20 20H3"></path></svg>
      </button>
    </div>

    </div>

    <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0">
      <sc-for list="{{ chipsEtiquetas }}" as="t" hint-placeholder-count="2">
        <span style="font-size:10px;font-weight:500;padding:2px 8px;border-radius:10px;background:var(--accent-light);color:var(--accent);border:.5px solid var(--accent-br);white-space:nowrap">{{ t.nombre }}</span>
      </sc-for>
    </div>

    <sc-if value="{{ archivada }}" hint-placeholder-val="{{ false }}">
      <span style="font-size:9px;padding:1px 6px;border-radius:10px;background:var(--info-light);color:var(--info);border:.5px solid var(--info-br);flex-shrink:0;white-space:nowrap">archivada</span>
    </sc-if>
  </div>

  <div ref="{{ refScroll }}" style="flex:1;min-height:0;overflow-y:auto;padding:10px 14px 24px;display:flex;flex-direction:column;gap:10px">
    <dc-import name="Colapsable" titulo="Datos" contactoId="{{ contactoId }}" chips="{{ datos }}" bloques="{{ notas }}" onEditar="{{ editarCampo }}" hint-size="100%,40px"></dc-import>
    <dc-import name="Colapsable" titulo="Contacto" contactoId="{{ contactoId }}" chips="{{ contactoChips }}" onEditar="{{ editarCampo }}" hint-size="100%,40px"></dc-import>
    <dc-import name="FechaReunion" contactoId="{{ contactoId }}" calendarios="{{ calendarios }}" ocupadosAjenos="{{ ocupadosAjenos }}" ocupados="{{ ocupados }}" eventos="{{ eventos }}" eventosDia="{{ eventosDia }}" confirmada="{{ confirmada }}" fechaConfirmada="{{ fecha }}" horaConfirmada="{{ hora }}" estado="{{ estado }}" historial="{{ historial }}" avisoRegla="{{ regla }}" proximoContacto="{{ proximoContacto }}" cargaDias="{{ cargaDias }}" onPanelProximo="{{ setBloqueo }}" abrirNonce="{{ nonceCal }}" focoProximo="{{ nonceProximo }}" onProximo="{{ setProximo }}" onConfirmar="{{ pedirConfirmacion }}" onEstado="{{ setEstado }}" onCambiarFecha="{{ cambiarFecha }}" onCambio="{{ marcarSucio }}" onRestaurarHistorial="{{ restaurarHistorial }}" onEliminarHistorial="{{ eliminarHistorial }}" hint-size="100%,340px"></dc-import>
    <sc-if value="{{ hayPropuesta }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 11px;border-radius:12px;border:.5px solid var(--warning);background:var(--warning-light);animation:om-abrir 160ms ease-out">
        <span style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;background:var(--warning);color:var(--surface);white-space:nowrap">Recordatorio</span>
        <span style="font-size:11px;color:var(--text);line-height:1.5;flex:1;min-width:160px;text-wrap:pretty">{{ textoPropuesta }}</span>
        <button type="button" onClick="{{ aceptarPropuesta }}" style="height:26px;padding:0 11px;border-radius:8px;border:none;background:var(--accent);color:var(--surface);font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background 150ms ease-out" style-hover="background:var(--accent-hover)">Aceptar fecha</button>
        <button type="button" onClick="{{ descartarPropuesta }}" style="height:26px;padding:0 10px;border-radius:8px;border:.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:10px;cursor:pointer;font-family:inherit;white-space:nowrap">La cargo a mano</button>
      </div>
    </sc-if>
    <sc-if value="{{ conEnvio }}" hint-placeholder-val="{{ true }}">
    <dc-import name="EnviarMensaje" contactoId="{{ contactoId }}" linkWhatsapp="{{ linkWhatsapp }}" linkChat="{{ linkChat }}" canalPorDefecto="{{ canalPorDefecto }}" canalNonce="{{ nonceCanal }}" idiomaSugerido="{{ idiomaSugerido }}" cuentaActual="{{ cuenta }}" sucio="{{ sucio }}" enviarNonce="{{ nonceEnviar }}" mensajes="{{ mensajesRepo }}" onDestacarCuenta="{{ destacarParaCuenta }}" onGuardarNuevo="{{ guardarMensajeNuevo }}" onAgregarIdioma="{{ agregarIdiomaMensaje }}" onDestacarTodas="{{ destacarTodasCuentas }}" onEnviar="{{ registrarEnvio }}" onCambio="{{ marcarSucio }}" onGuardar="{{ guardar }}" hint-size="100%,240px"></dc-import>
    </sc-if>
  </div>

  <sc-if value="{{ analisisAbierto }}" hint-placeholder-val="{{ false }}">
    <dc-import name="AnalisisPerfil" contacto="{{ contacto }}" onCerrar="{{ cerrarAnalisis }}" hint-size="100%,100%"></dc-import>
  </sc-if>
  <sc-if value="{{ logAbierto }}" hint-placeholder-val="{{ false }}">
    <dc-import name="LogEdiciones" entradas="{{ log }}" onRevertir="{{ revertirLog }}" onCerrar="{{ cerrarLog }}" hint-size="100%,100%"></dc-import>
  </sc-if>
  <sc-if value="{{ confirmarAbierto }}" hint-placeholder-val="{{ false }}">
    <dc-import name="ConfirmarReunion" emails="{{ emails }}" fecha="{{ pendienteFecha }}" hora="{{ pendienteHora }}" duracion="{{ pendienteDuracion }}" onEnviar="{{ confirmarEnvio }}" onCerrar="{{ cerrarConfirmar }}" hint-size="100%,100%"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:768},&quot;contacto&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;catalogoEtiquetas&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;},&quot;onSucio&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(s:boolean)=&gt;void&quot;},&quot;onGuardar&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;waAbierta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;canalActivo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;LinkedIn&quot;,&quot;WhatsApp&quot;],&quot;default&quot;:&quot;LinkedIn&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onDestacar&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(texto:string,alcance:string,nombre:string)=&gt;void&quot;},&quot;repoCompleto&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;},&quot;onDestacarCuenta&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(ids:string[],cuenta:string)=&gt;void&quot;},&quot;onGuardarNuevo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string,nombre:string,texto:string,idioma:string)=&gt;void&quot;},&quot;onAgregarIdioma&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string,idioma:string,texto:string)=&gt;void&quot;},&quot;onDestacarTodas&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  static CODIGOS = { Brasil: '55', México: '52', Argentina: '54', Uruguay: '598', Chile: '56', Colombia: '57', Perú: '51', Paraguay: '595', Bolivia: '591', Mozambique: '258', Portugal: '351', España: '34', 'Estados Unidos': '1' };

  static normalizarTel(valor, pais) {
    const crudo = (valor || '').trim();
    if (!crudo) return crudo;
    const soloNum = crudo.replace(/\D/g, '');
    if (!soloNum) return crudo;
    const cod = Component.CODIGOS[pais];
    if (crudo.charAt(0) === '+') return crudo;
    if (!cod) return crudo;
    if (soloNum.indexOf(cod) === 0) return '+' + soloNum;
    return '+' + cod + ' ' + soloNum;
  }

  state = { accionesAbierto: false, asignarAbierto: false,
    logAbierto: false, etiquetasAbierto: false, linksAbierto: false, confirmarAbierto: false, infoVisible: false,
    pendiente: null, confirmada: null, fecha: null, hora: null, estado: null,
    aplicadas: null, links: null, campos: null, sucio: false, historial: null, regla: '', analisisAbierto: false,
    nonceEnviar: 0, nonceProximo: 0, nonceCal: 0, nonceCanal: 0, proximo: null, foto: null, reenviado: false, atajosBloqueados: false, pila: [], propuesta: null
  };

  static REVERTIBLES = ['Cargo', 'Empresa', 'Web', 'Industria', 'Ciudad', 'Teléfono', 'Email', 'Email 2', 'Email 3', 'Etiquetas', 'Estado de reunión'];

  static DIAS_R = { R1: 15, R2: 15, R3: 21, R4: 28, R5: 15, R6: 15, R7: 21, R8: 28 };
  static SIGUIENTE_R = { R0: 'R1', R1: 'R2', R2: 'R3', R3: 'R4', R4: 'Fase 2', R5: 'R6', R6: 'R7', R7: 'R8', R8: 'Fase 2' };

  static suma(iso, d) {
    const x = new Date((iso || '2026-09-04') + 'T12:00:00');
    x.setDate(x.getDate() + d);
    return x.toISOString().slice(0, 10);
  }
  static dm(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : 'sin fecha'; }
  static idiomaDe(pais) {
    if (pais === 'Brasil') return 'PT';
    if (['Argentina', 'México', 'Uruguay', 'Chile', 'Colombia', 'Perú', 'España', 'Paraguay'].indexOf(pais) >= 0) return 'ES';
    return 'EN';
  }

  registrarEnvio(texto, canal) {
    const c = this.props.contacto || {};
    const etapa = c.etapa || 'R1';
    const sig = Component.SIGUIENTE_R[etapa] || 'R1';
    const fase2 = sig === 'Fase 2' || etapa === 'Fase 2';
    const dias = fase2 ? 90 : (Component.DIAS_R[sig] || 15);
    const hoy = '2026-09-04';
    const previas = this.state.aplicadas || c.etiquetas || [];
    let etiquetas = previas.indexOf('Recordatorio') >= 0 ? previas.slice() : previas.concat(['Recordatorio']);
    if (fase2 && etiquetas.indexOf('Fase 2') < 0) etiquetas = etiquetas.concat(['Fase 2']);
    this.aplicar({ aplicadas: etiquetas }, 'Etiqueta recordatorio');
    const historial = (this.state.historialEnvios || c.historialEnvios || []).concat([{
      r: etapa, fecha: hoy + ' ' + new Date().toTimeString().slice(0, 5), canal, textoUsado: (texto || '').slice(0, 80)
    }]);
    this.aplicar({ historialEnvios: historial }, 'Registro de envío');
    this.setState({
      propuesta: {
        fecha: Component.suma(hoy, dias),
        vencimiento: this.state.proximo !== null ? this.state.proximo : (c.proximoContacto || ''),
        etapa: sig, dias, fase2, canal
      }
    });
  }

  aceptarPropuesta() {
    const p = this.state.propuesta;
    if (!p) return;
    this.aplicar({ proximo: p.fecha }, 'Próximo contacto');
    this.setState({ propuesta: null });
  }

  async pegarFotoLead() {
    try {
      const items = await navigator.clipboard.read();
      for (const it of items) {
        const tipo = it.types.find(t => t.startsWith('image/'));
        if (!tipo) continue;
        const blob = await it.getType(tipo);
        this.aplicar({ foto: URL.createObjectURL(blob) }, 'Foto');
        return;
      }
    } catch (err) { this.setState({ foto: null }); }
  }

  componentDidMount() {
    this._key = e => {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (this.state.atajosBloqueados) return;
      const k = (e.key || '').toLowerCase();
      const c = this.props.contacto || {};
      const links = this.state.links || { perfil: c.linkPerfil || '', chat: c.linkChat || '' };
      if (k === 'a') { e.preventDefault(); this.setState({ sucio: false, pila: [] }); if (this.props.onGuardar) this.props.onGuardar(); }
      else if (k === 's') { e.preventDefault(); this.setState(s => ({ nonceEnviar: s.nonceEnviar + 1 })); }
      else if (k === 'd') { e.preventDefault(); this.setState(s => ({ nonceProximo: s.nonceProximo + 1 })); }
      else if (k === 'r') { e.preventDefault(); this.setState(s => ({ nonceCal: s.nonceCal + 1 })); }
      else if (k === 'f') { e.preventDefault(); this.setState(s => ({ nonceCanal: s.nonceCanal + 1 })); }
      else if (k === 'v') { e.preventDefault(); if (links.perfil) window.open(links.perfil, '_blank'); }
      else if (k === 'h') {
        e.preventDefault();
        const tel = (c.telefono || '').replace(/\D/g, '');
        if (this.props.canalActivo === 'WhatsApp') { if (tel) window.open('https://wa.me/' + tel, '_blank'); }
        else if (links.chat || c.linkChat) window.open(links.chat || c.linkChat, '_blank');
      }
      else if (k === 'c') { e.preventDefault(); this.deshacer(); }
      else if (k === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); this.deshacer(); }
    };
    document.addEventListener('keydown', this._key);
  }
  componentWillUnmount() { document.removeEventListener('keydown', this._key); }

  componentDidUpdate(prev) {
    const a = prev.contacto && prev.contacto.id, b = this.props.contacto && this.props.contacto.id;
    if (a !== b) this.setState({
      logAbierto: false, etiquetasAbierto: false, linksAbierto: false, confirmarAbierto: false, infoVisible: false,
      pendiente: null, confirmada: null, fecha: null, hora: null, estado: null,
      aplicadas: null, links: null, campos: null, sucio: false, historial: null, regla: '', analisisAbierto: false, proximo: null, foto: null, reenviado: false, pila: [], propuesta: null
    });
  }

  marcar() {
    if (!this.state.sucio) this.setState({ sucio: true });
    if (this.props.onSucio) this.props.onSucio(true);
  }

  aplicar(patch, etiqueta) {
    const antes = {};
    Object.keys(patch).forEach(k => { antes[k] = this.state[k] === undefined ? null : this.state[k]; });
    this.setState(s => ({ ...patch, pila: (s.pila || []).concat([{ antes, etiqueta }]) }));
    this.marcar();
  }

  deshacer() {
    const pila = this.state.pila || [];
    if (!pila.length) return;
    const ult = pila[pila.length - 1];
    const quedan = pila.slice(0, -1);
    this.setState({ ...ult.antes, pila: quedan, sucio: quedan.length > 0 });
    if (!quedan.length && this.props.onSucio) this.props.onSucio(false);
  }

  analisisDe(c) {
    const li = c.mensajesLi || [], wa = c.mensajesWa || [];
    const todos = li.concat(wa);
    const env = todos.filter(m => m.quien === 'out').length;
    const rec = todos.filter(m => m.quien !== 'out').length;
    const tasa = env ? Math.round((rec / env) * 100) + '%' : '';
    const f = c.fechas || {};
    return [
      { label: 'Enviados', value: String(env), editable: false },
      { label: 'Recibidos', value: String(rec), editable: false },
      { label: 'Respuesta', value: tasa, editable: false },
      { label: '1er msj → respuesta', value: f.demoraRespuesta || '', editable: false },
      { label: '1er msj → reunión', value: f.demoraReunion || '', editable: false },
      { label: 'Último contacto', value: f.ultimoContacto || '', editable: false }
    ];
  }

  renderVals() {
    const c = this.props.contacto || {};
    const campos = this.state.campos || {};
    const val = (k, d) => campos[k] !== undefined ? campos[k] : (d || '');
    const conf = this.state.confirmada !== null ? this.state.confirmada : !!(c.reunion && c.reunion.fecha);
    const fecha = this.state.fecha !== null ? this.state.fecha : ((c.reunion && c.reunion.fecha) || '');
    const hora = this.state.hora !== null ? this.state.hora : ((c.reunion && c.reunion.hora) || '');
    const estado = this.state.estado !== null ? this.state.estado : ((c.reunion && c.reunion.estado) || null);
    const aplicadas = this.state.aplicadas || c.etiquetas || [];
    const links = this.state.links || { perfil: c.linkPerfil || '', chat: c.linkChat || '' };
    const p = this.state.pendiente || {};
    const f = c.fechas || {};
    const hist = this.state.historial || c.historial || [];
    const pila = this.state.pila || [];
    const ultimaEdicion = pila.length ? pila[pila.length - 1].etiqueta : '';

    const usuariosProp = this.props.usuarios || [];
    const duenioId = this.props.duenio || '';
    const duenioUs = usuariosProp.find(x => x.id === duenioId) || {};
    const inic = n => (n || '').split(' ').filter(Boolean).map(p => p[0]).slice(0, 2).join('').toUpperCase();
    return {
      tieneTelefono: !!(val('Teléfono', c.telefono) || '').replace(/\D/g, ''),
      telefonoCorto: (val('Teléfono', c.telefono) || '').replace(/\s+/g, ' ').trim(),
      tituloWa: 'Abrir el chat de WhatsApp con ' + (c.nombre || '').split(' ')[0] + ' (' + (val('Teléfono', c.telefono) || '') + ')',
      conAsignacion: this.props.puedeAsignar === true && usuariosProp.length > 1,
      duenioLabel: duenioId ? ((duenioUs.nombre || 'sin asignar').split(' ')[0]) : 'sin asignar',
      asignarAbierto: this.state.asignarAbierto,
      toggleAsignar: () => this.setState(s => ({ asignarAbierto: !s.asignarAbierto })),
      cerrarAsignar: () => this.setState({ asignarAbierto: false }),
      asignables: [{ id: '', nombre: 'Sin asignar', rol: '' }].concat(usuariosProp.filter(x => x.estado !== 'pendiente')).map(x => ({
        nombre: x.nombre,
        iniciales: x.id ? inic(x.nombre) : '—',
        color: x.id ? (x.rol === 'Administrador' ? 'var(--accent)' : 'var(--muted)') : 'var(--border)',
        actual: (x.id || '') === (duenioId || ''),
        fondo: (x.id || '') === (duenioId || '') ? 'var(--accent-light)' : 'transparent',
        elegir: () => { this.setState({ asignarAbierto: false }); if (this.props.onAsignar) this.props.onAsignar(c.id, x.id); }
      })),
      conEnvio: this.props.conEnvio !== false,
      calendarios: this.props.calendarios || null,
      ocupadosAjenos: this.props.ocupadosAjenos || [],
      contactoId: c.id || '',
      cuenta: c.cuentaAbrev || '—',
      nombre: (c.nombre || '').split('—')[0].trim(),
      tieneFoto: !!this.state.foto,
      sinFoto: !this.state.foto,
      foto: this.state.foto || '',
      iniciales: (function (n) {
        const p = (n || '').trim().split(/\s+/);
        return (p[0] || '?').charAt(0).toUpperCase() + (p.length > 1 ? p[p.length - 1].charAt(0).toUpperCase() : '');
      })(c.nombre),
      pegarFoto: () => this.pegarFotoLead(),
      reenviado: this.state.reenviado,
      tituloReenviar: this.state.reenviado ? 'Invitación reenviada' : 'Reenviar la invitación de LinkedIn',
      fondoReenviar: this.state.reenviado ? 'var(--accent-light)' : 'transparent',
      colorReenviar: this.state.reenviado ? 'var(--accent)' : 'var(--muted)',
      reenviar: () => this.aplicar({ reenviado: true }, 'Reenvío de invitación'),
      lista: c.lista || 'lista sin registrar',
      linkPerfil: links.perfil || '#',
      linkWhatsapp: (c.telefono || '').replace(/\D/g, '') ? 'https://wa.me/' + (c.telefono || '').replace(/\D/g, '') : '#',
      linkChat: links.chat || '',
      emails: [val('Email', c.email), val('Email 2', c.email2), val('Email 3', c.email3)].filter(Boolean),
      nEtiquetas: aplicadas.length,
      archivada: estado === 'asistio' || estado === 'no-asistio',
      noEditable: false,

      infoVisible: this.state.infoVisible,
      verInfo: () => this.setState({ infoVisible: true }),
      ocultarInfo: () => this.setState({ infoVisible: false }),
      hitos: [
        { label: 'Lista', value: c.lista || 'sin registrar' },
        { label: 'Invitación', value: f.invitacion || 'sin registro' },
        { label: 'Aceptada', value: f.aceptacion || 'sin registro' },
        { label: 'Respondió', value: f.respuesta || 'nunca respondió' }
      ],
      chipsEtiquetas: aplicadas.map(nombre => ({ nombre })),

      datos: [
        { label: 'Cargo', value: val('Cargo', c.cargo) },
        { label: 'Empresa', value: val('Empresa', c.empresa) },
        { label: 'Web', value: val('Web', c.web) },
        { label: 'Industria', value: val('Industria', c.industria) },
        { label: 'Ciudad', value: val('Ciudad', c.ciudad) }
      ],
      notas: [{ label: 'Acerca de', value: c.nota || '' }],
      contactoChips: [
        { label: 'Teléfono', value: val('Teléfono', c.telefono) },
        { label: 'Email', value: val('Email', c.email) },
        { label: 'Email 2', value: val('Email 2', c.email2) },
        { label: 'Email 3', value: val('Email 3', c.email3) }
      ],
      analisis: this.analisisDe(c),
      accionesAbierto: this.state.accionesAbierto,
      toggleAcciones: () => this.setState(s => ({ accionesAbierto: !s.accionesAbierto })),
      cerrarAcciones: () => this.setState({ accionesAbierto: false }),
      bordeAcciones: this.state.accionesAbierto ? 'var(--accent)' : 'var(--border)',
      fondoAcciones: this.state.accionesAbierto ? 'var(--accent-light)' : 'transparent',
      colorAcciones: this.state.accionesAbierto ? 'var(--accent)' : 'var(--muted)',
      gruposAcciones: (() => {
        const cerrar = fn => () => { this.setState({ accionesAbierto: false }); if (fn) fn(); };
        const tel = (val('Teléfono', c.telefono) || '').replace(/\D/g, '');
        const links = this.state.links || { perfil: c.linkPerfil || '', chat: c.linkChat || '' };
        const bump = k => cerrar(() => this.setState(s => ({ [k]: (s[k] || 0) + 1 })));
        const grupos = [
          { titulo: 'Ficha', items: [
            { label: 'Guardar cambios', detalle: this.state.sucio ? 'hay cambios sin guardar' : 'nada pendiente', atajo: 'A', activo: true,
              correr: cerrar(() => { this.setState({ sucio: false, pila: [] }); if (this.props.onGuardar) this.props.onGuardar(); }) },
            { label: 'Deshacer última edición', detalle: ultimaEdicion || 'sin ediciones', atajo: 'Z', activo: pila.length > 0,
              correr: cerrar(() => this.deshacer()) }
          ] },
          { titulo: 'Contacto', items: [
            { label: 'Enviar mensaje', detalle: 'abre el redactor en el canal sugerido', atajo: 'S', activo: this.props.conEnvio !== false, correr: bump('nonceEnviar') },
            { label: 'Cambiar canal de envío', detalle: 'LinkedIn / WhatsApp', atajo: 'F', activo: this.props.conEnvio !== false, correr: bump('nonceCanal') },
            { label: 'Abrir el chat real', detalle: tel ? 'WhatsApp ' + (val('Teléfono', c.telefono) || '') : 'LinkedIn', atajo: 'H', activo: !!(tel || links.chat),
              correr: cerrar(() => { if (tel) window.open('https://wa.me/' + tel, '_blank'); else if (links.chat) window.open(links.chat, '_blank'); }) },
            { label: 'Ver el perfil', detalle: 'LinkedIn del lead', atajo: 'V', activo: !!links.perfil,
              correr: cerrar(() => { if (links.perfil) window.open(links.perfil, '_blank'); }) }
          ] },
          { titulo: 'Seguimiento', items: [
            { label: 'Próximo contacto', detalle: 'elegir la fecha del recordatorio', atajo: 'D', activo: true, correr: bump('nonceProximo') },
            { label: 'Fecha de reunión', detalle: 'abre el calendario de disponibilidad', atajo: 'R', activo: true, correr: bump('nonceCal') },
            { label: 'Análisis del perfil', detalle: 'ventana, caída y probabilidad', atajo: '', activo: true,
              correr: cerrar(() => this.setState({ analisisAbierto: true })) }
          ] }
        ];
        if (this.props.puedeAsignar === true && (this.props.usuarios || []).length > 1) {
          grupos.push({ titulo: 'Asignación', items: [{ label: 'Asignar a otro usuario', detalle: 'hoy: ' + ((usuariosProp.find(x => x.id === duenioId) || {}).nombre || 'sin asignar'), atajo: '', activo: true, correr: cerrar(() => this.setState({ asignarAbierto: true })) }] });
        }
        return grupos.map(g => ({
          titulo: g.titulo,
          items: g.items.map(a => ({
            label: a.label, detalle: a.detalle, atajo: a.atajo, tieneAtajo: !!a.atajo,
            color: a.activo ? 'var(--text)' : 'var(--hint)',
            correr: a.activo ? a.correr : (() => this.setState({ accionesAbierto: false }))
          }))
        }));
      })(),
      contacto: c,
      analisisAbierto: this.state.analisisAbierto,
      abrirAnalisis: () => this.setState({ analisisAbierto: true }),
      cerrarAnalisis: () => this.setState({ analisisAbierto: false }),
      editarCampo: (label, value) => {
        let v = value;
        if (label === 'Teléfono') v = Component.normalizarTel(value, c.pais);
        this.aplicar({ campos: { ...(this.state.campos || {}), [label]: v } }, label);
      },

      hayDeshacer: pila.length > 0,
      etiquetaDeshacer: ultimaEdicion ? 'Deshacer ' + ultimaEdicion.toLowerCase() : 'Deshacer',
      tituloDeshacer: 'Deshacer la última edición: ' + ultimaEdicion + ' (Z)',
      deshacer: () => this.deshacer(),

      ocupados: c.ocupados || [],
      nonceCal: this.state.nonceCal,
      nonceProximo: this.state.nonceProximo,
      nonceEnviar: this.state.nonceEnviar,
      nonceCanal: this.state.nonceCanal,
      canalPorDefecto: (c.telefono || '').replace(/\D/g, '') ? 'WhatsApp' : 'LinkedIn',
      idiomaSugerido: Component.idiomaDe(c.pais),
      registrarEnvio: (texto, canal) => this.registrarEnvio(texto, canal),
      hayPropuesta: !!this.state.propuesta,
      textoPropuesta: (function (p) {
        if (!p) return '';
        const regla = p.fase2 ? 'fase 2: se corre 3 meses' : (p.dias === 21 ? p.etapa + ': cada 3 semanas' : (p.dias === 28 ? p.etapa + ': cada 4 semanas' : p.etapa + ': cada 15 días'));
        return 'Vencimiento ' + Component.dm(p.vencimiento) + ' · próximo contacto propuesto ' + Component.dm(p.fecha) + ' (' + regla + ')';
      })(this.state.propuesta),
      aceptarPropuesta: () => this.aceptarPropuesta(),
      descartarPropuesta: () => this.setState({ propuesta: null }),
      destacados: this.props.destacados || [],
      mensajesRepo: this.props.repoCompleto || [],
      destacarParaCuenta: (ids, cuenta) => { if (this.props.onDestacarCuenta) this.props.onDestacarCuenta(ids, cuenta); },
      guardarMensajeNuevo: (id, nombre, texto, idioma) => { if (this.props.onGuardarNuevo) this.props.onGuardarNuevo(id, nombre, texto, idioma); },
      agregarIdiomaMensaje: (id, idioma, texto) => { if (this.props.onAgregarIdioma) this.props.onAgregarIdioma(id, idioma, texto); },
      destacarTodasCuentas: id => { if (this.props.onDestacarTodas) this.props.onDestacarTodas(id); },
      destacarMensaje: (texto, alcance, nombre) => { if (this.props.onDestacar) this.props.onDestacar(texto, alcance, nombre); },
      proximoContacto: this.state.proximo !== null ? this.state.proximo : (c.proximoContacto || ''),
      setProximo: v => this.aplicar({ proximo: v }, 'Próximo contacto'),
      cargaDias: this.props.cargaDias || {},
      setBloqueo: v => this.setState({ atajosBloqueados: !!v }),
      eventos: c.eventos || {},
      eventosDia: c.eventosDia || {},
      historial: hist,
      regla: this.state.regla,
      restaurarHistorial: i => {
        this.setState({ historial: hist.filter((_, k) => k !== i), estado: null, regla: '' });
        this.marcar();
      },
      eliminarHistorial: i => {
        this.setState({ historial: hist.filter((_, k) => k !== i), regla: '' });
        this.marcar();
      },
      confirmada: conf, fecha, hora, estado,
      pedirConfirmacion: (fx, hx, dx) => this.setState({ pendiente: { f: fx, h: hx, d: dx }, confirmarAbierto: true }),
      confirmarEnvio: () => { this.aplicar({ confirmada: true, fecha: p.f, hora: p.h, estado: null }, 'Fecha de reunión'); this.setState({ confirmarAbierto: false }); },
      cerrarConfirmar: () => this.setState({ confirmarAbierto: false }),
      confirmarAbierto: this.state.confirmarAbierto,
      pendienteFecha: p.f || '', pendienteHora: p.h || '', pendienteDuracion: p.d || 30,
      setEstado: e => {
        if (!e) { this.aplicar({ estado: null, regla: '' }, 'Estado de reunión'); return; }
        const texto = e === 'asistio' ? 'asistió' : (e === 'no-asistio' ? 'no asistió' : 'cancelada');
        const choque = hist.find(h => h.fecha === fecha && h.resultado !== texto);
        if (choque) {
          this.setState({ regla: 'ya hay «' + choque.resultado + '» ese día — restaurá el histórico primero' });
          return;
        }
        const resto = hist.filter(h => h.fecha !== fecha);
        this.aplicar({ estado: e, regla: '', historial: resto.concat([{ fecha, hora, resultado: texto }]) }, 'Estado de reunión');
      },
      cambiarFecha: () => this.setState({ confirmada: false }),

      mensajesLi: c.mensajesLi || [],
      waAbierta: this.props.waAbierta === true,
      telefonoLead: val('Teléfono', c.telefono),
      refScroll: el => { this._scroll = el; },
      mensajesWa: c.mensajesWa || [],

      log: (c.log || []).map((e, i) => ({ ...e, indice: i, puedeRevertir: Component.REVERTIBLES.indexOf(e.campo) >= 0 })),
      revertirLog: i => {
        const e = (c.log || [])[i];
        if (!e) return;
        const previo = e.antes || '';
        if (e.campo === 'Etiquetas') this.aplicar({ aplicadas: previo ? previo.split(', ') : [] }, 'Etiquetas revertidas');
        else if (e.campo === 'Estado de reunión') {
          const mapa = { 'asistió': 'asistio', 'no asistió': 'no-asistio', 'cancelada': 'cancelada' };
          this.aplicar({ estado: mapa[previo] || null, regla: '' }, 'Estado de reunión revertido');
        }
        else this.aplicar({ campos: { ...(this.state.campos || {}), [e.campo]: previo } }, e.campo + ' revertido');
        this.setState({ logAbierto: false });
      },
      logAbierto: this.state.logAbierto,
      abrirLog: () => this.setState({ logAbierto: true }),
      cerrarLog: () => this.setState({ logAbierto: false }),

      catalogo: this.props.catalogoEtiquetas || [],
      aplicadas,
      etiquetasAbierto: this.state.etiquetasAbierto,
      toggleEtiquetas: () => this.setState(s => ({ etiquetasAbierto: !s.etiquetasAbierto, linksAbierto: false })),
      cerrarEtiquetas: () => this.setState({ etiquetasAbierto: false }),
      setAplicadas: a => this.aplicar({ aplicadas: a }, 'Etiquetas'),

      linksAbierto: this.state.linksAbierto,
      toggleLinks: () => this.setState(s => ({ linksAbierto: !s.linksAbierto, etiquetasAbierto: false })),
      cerrarLinks: () => this.setState({ linksAbierto: false }),
      guardarLinks: (perfil, chat) => { this.aplicar({ links: { perfil, chat } }, 'Links'); this.setState({ linksAbierto: false }); },

      sucio: this.state.sucio,
      marcarSucio: () => this.marcar(),
      guardar: () => { this.setState({ sucio: false, pila: [] }); if (this.props.onGuardar) this.props.onGuardar(); }
    };
  }
}
</script>
</body>
</html>
