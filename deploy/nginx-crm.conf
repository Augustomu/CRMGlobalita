# nginx para crm.globalita.tech -> PocketBase en 127.0.0.1:8090
#
# Va en /etc/nginx/sites-available/crm.globalita.tech y se enlaza a
# sites-enabled/. Es un server block NUEVO: no toca la configuracion de
# bitacorapersonal.online, que sigue igual.
#
# Este archivo es solo HTTP. El bloque HTTPS y el redirect los agrega certbot
# solo cuando se corre:
#     certbot --nginx -d crm.globalita.tech

server {
    listen 80;
    listen [::]:80;
    server_name crm.globalita.tech;

    # Fotos de los leads pegadas desde el portapapeles.
    client_max_body_size 25M;

    # El realtime de PocketBase usa Server-Sent Events: sin esto, nginx
    # acumula la respuesta en un buffer y los eventos llegan tarde o no llegan.
    location /api/realtime {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # PocketBase usa esto para saber que la conexion original era HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
    }
}
